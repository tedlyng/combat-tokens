<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Combat stats</title>
  <link rel="stylesheet" href="style.css?v=1.2.0" />
</head>
<body>
  <p id="status" class="muted">Loading…</p>

  <div id="none" hidden>
    <p class="muted">This token has no combat stats yet.</p>
    <button id="add" class="primary">Add combat stats</button>
  </div>

  <div id="form" hidden>
    <div class="top-stats">
      <div class="stat"><label for="hp"><svg viewBox="-1 -1 2 2"><path d="M0 .9C-.35.62-1 .2-1-.32-1-.78-.62-1-.33-1-.12-1 0-.84 0-.66 0-.84.12-1 .33-1 .62-1 1-.78 1-.32 1 .2.35.62 0 .9Z" fill="#c62828"/></svg>HP</label><input id="hp" type="number" inputmode="numeric" /></div>
      <div class="stat"><label for="hpMax" title="Maximum HP, used for the coloured health ring">Max</label><input id="hpMax" type="number" inputmode="numeric" /></div>
      <div class="stat"><label for="defense"><svg viewBox="-1 -1 2 2"><circle r=".75" fill="none" stroke="#2f6fe0" stroke-width=".35"/></svg>Def</label><input id="defense" type="number" inputmode="numeric" /></div>
      <div class="stat"><label for="armor"><svg viewBox="-1 -1 2 2"><circle r=".72" fill="none" stroke="#a7b1ba" stroke-width=".45"/></svg>Armor</label><input id="armor" type="number" inputmode="numeric" /></div>
      <div class="stat"><label for="shield"><svg viewBox="-1 -1 2 2"><path d="M-.82-.86C-.35-.72.35-.72.82-.86L.82-.05C.82.48.42.8 0 .98-.42.8-.82.48-.82-.05Z" fill="#9c6b2f"/></svg>Shield</label><input id="shield" type="number" inputmode="numeric" /></div>
      <div class="stat"><label for="toHit"><svg viewBox="-1 -1 2 2"><g transform="rotate(45)"><path d="M0-1 .14-.78.14.38-.14.38-.14-.78Z" fill="#d9dee3"/><path d="M-.52.38H.52V.52H-.52ZM-.09.52H.09V.84H-.09Z" fill="#c9a248"/></g></svg>To-hit</label><input id="toHit" type="number" inputmode="numeric" /></div>
    </div>

    <div class="tri">
      <span class="group">Damage</span>
      <div class="stat"><label for="dmgLow">Low 1–2</label><input id="dmgLow" type="number" inputmode="numeric" /></div>
      <div class="stat"><label for="dmgMid">Med 3–8</label><input id="dmgMid" type="number" inputmode="numeric" /></div>
      <div class="stat"><label for="dmgHigh">High 9–10</label><input id="dmgHigh" type="number" inputmode="numeric" /></div>
    </div>
    <div class="tri">
      <span class="group">Initiative</span>
      <div class="stat"><label for="initLow">Low 1–2</label><input id="initLow" type="number" inputmode="numeric" /></div>
      <div class="stat"><label for="initMid">Med 3–8</label><input id="initMid" type="number" inputmode="numeric" /></div>
      <div class="stat"><label for="initHigh">High 9–10</label><input id="initHigh" type="number" inputmode="numeric" /></div>
    </div>

    <div class="owner gm-owner" hidden>
      <span>Player</span>
      <select id="owner"></select>
    </div>

    <div class="foot">
      <span id="save-state"></span>
      <button id="remove" class="link" hidden>Remove stats</button>
    </div>
  </div>
  <script type="module" src="edit.js?v=1.2.0"></script>
</body>
</html>
